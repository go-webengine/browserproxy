#
# Pure-Go CI: everything builds and tests with CGO_ENABLED=0 (no C toolchain).
# The `test` job builds, vets and tests natively (with -short, so the live
# example.com integration test is skipped) and enforces a 100% coverage floor on
# the root package's pure logic (SSRF guard, session state, scroll slicing, gRPC
# dispatch/stream loop). The `cross-build` job cross-compiles the whole module
# for all six of Go's 64-bit targets. The `wasm` job compiles the js/wasm
# browserproxy client and runs it under Node against a live server — the proof
# that the gRPC-over-WebSocket transport gives a pure-Go browser client.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  # ⛔ GO_VERSION IS GONE, AND THE COMMENT IT CARRIED IS WHY. It said:
  #
  #   KEEP THIS EQUAL TO go.mod's `go` DIRECTIVE. [...] Raising go.mod alone
  #   would leave the lane building the vulnerable one.
  #
  # That was right, and it was a rule with nothing to enforce it. On 2026-11-15
  # the directive moved to 1.27.4 for GO-2026-6859 while this still said
  # "1.27.3" — the note's own warning, two weeks later. `setup-go` sets
  # GOTOOLCHAIN=local, so the lane does not build the older toolchain quietly:
  # it REFUSES with `go.mod requires go >= 1.27.4`. Measured the same day on
  # five of six go-filesystems repositories, every job red at once.
  #
  # So each step now reads `go-version-file: go.mod` instead. The equality the
  # comment asked for is structural rather than requested, and the next raise
  # needs no edit here. ⚠ An expression like `${{ env.GO_VERSION }}` also hid
  # this from `gofloor`, which classifies a hard-coded pin as a finding but an
  # expression as merely "expression" — a literal one indirection away was
  # invisible to the auditor written to find exactly this.

jobs:
  test:
    name: build · vet · test · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build (CGO_ENABLED=0)
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -short skips the live-network TestIntegration_ExampleCom; every unit
      # test (SSRF guard, protocol codec, session, WS dispatch/loop) still runs.
      - name: Test
        run: go test -short ./...

      - name: Coverage gate (100% on the root package)
        run: bash scripts/coverage-gate.sh

  cross-build:
    name: cross-build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64, loong64, ppc64le, s390x]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build for linux/${{ matrix.goarch }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  wasm:
    name: wasm client (js/wasm + node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24" # global WebSocket + arraybuffer messages

      # The whole browserproxy client stack must compile to the browser target.
      - name: Compile-check js/wasm client
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -o /dev/null ./wasmclient

      # Build the real client to wasm, run it under Node against a live
      # (stub-rendered) server, and assert a full bidirectional Session.
      - name: Wasm end-to-end
        run: go test -run TestWasmClientE2E -v .
